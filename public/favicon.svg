<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 中央に大きな赤い「祭」の文字のみを配置 -->
  <!-- 白い縁取りや影をすべて削除し、最もシンプルな形にしています -->
  <text x="50" y="70" 
        font-family="'Yu Mincho', serif" 
        font-size="85" 
        font-weight="bold" 
        fill="#ee1c24" 
        text-anchor="middle">祭</text>
</svg>
